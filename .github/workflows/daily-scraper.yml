name: Automated Multi-Category Scraper

on:
  schedule:
    # Runs daily at 11:00 AM UTC (6:00 AM Perú time)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Multi-Category Scraper
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape

      - name: Commit & Push Updated Data
        run: |
          git config --local user.email "bot@impulsajoven.pe"
          git config --local user.name "Impulsa Joven Scraper Bot"
          git add src/data/opportunitiesDetailData.js
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en convocatorias."
          else
            git commit -m "chore(scraper): actualización automática de convocatorias [skip ci]"
            git push origin main
          fi
